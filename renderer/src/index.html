<!doctype html>
<html lang="pt" data-width="normal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Nothing may be loaded from the network; the scheme handler serves both. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src margin: data:; style-src 'unsafe-inline' margin:; font-src data: margin:; script-src margin:;"
    />
    <link rel="stylesheet" href="margin://app/bundle.css" />
    <title>Margin</title>
  </head>
  <body>
    <main id="content"></main>
    <script src="margin://app/bundle.js"></script>
  </body>
</html>
